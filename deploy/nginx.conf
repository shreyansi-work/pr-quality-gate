# /etc/nginx/sites-available/prgate  (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
# Get the certificate with:  sudo certbot --nginx -d prgate.example.com
server {
  listen 80;
  server_name prgate.example.com;

  client_max_body_size 5m; # webhook payloads and diffs

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
